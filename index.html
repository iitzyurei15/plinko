<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plinko Casino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top-bar">
    <h1>🎯 Plinko Casino</h1>
    <div class="balance">Balance: <span id="balance">1000</span> Coins</div>
  </header>

  <main>
    <section id="home" class="card">
      <h2>Welcome to Plinko</h2>
      <p>Drop a chip, hit a multiplier, and grow your coin stack.</p>
      <button id="start-btn" class="primary">Play Plinko</button>
    </section>

    <section id="game" class="card hidden">
      <div class="controls">
        <label for="bet">Bet Amount</label>
        <input id="bet" type="number" min="1" value="25" />
        <button id="drop-btn" class="primary">Drop Ball</button>
      </div>

      <div class="board-wrap">
        <div id="ball" class="ball hidden"></div>
        <div id="board" class="board"></div>
        <div id="slots" class="slots"></div>
      </div>

      <p id="result" class="result">Set your bet and drop a ball.</p>
      <button id="home-btn" class="ghost">Back to Home</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
